.ctrl{display:flex;flex-wrap:wrap;gap:18px 26px;align-items:center;padding:6px 24px 14px;color:var(--mute)}

select{background:#211d17;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px 6px;font:inherit}

.hud{position:relative;width:var(--w,1100px);max-width:100%;user-select:none}
.hud>.frame{display:block;width:100%;height:auto;position:relative;z-index:1;pointer-events:none}
.abs{position:absolute}
.por{z-index:2;-webkit-mask-size:100% 100%;mask-size:100% 100%;overflow:hidden}
.por img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.por .cry{opacity:.38;mix-blend-mode:screen;object-fit:fill}
.por.zoom .cry,.por.zoom .fac{inset:-14%;width:128%;height:128%}
.por .fac{object-fit:fill;opacity:.75;mix-blend-mode:screen}

.por.down img.pic{filter:grayscale(1) brightness(.55)}.por.down .shine{display:none}
.bar{z-index:2;overflow:visible}
.bar img{position:absolute;inset:-6% -1%;width:102%;height:112%;transition:clip-path .35s}
.bar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;text-shadow:0 1px 2px #000,0 0 4px #000;font-size:calc(var(--w,1100px)*.0125)}

.act{z-index:3;cursor:pointer;transition:filter .25s,transform .15s}.act:hover{transform:scale(1.05)}
.act.spent{filter:grayscale(1) brightness(.45) contrast(.9)}
.slot{z-index:2;display:flex;align-items:flex-end;justify-content:flex-end;padding:2px 3px;color:#ffffff70;font-size:calc(var(--w,1100px)*.0075);font-weight:700;border-radius:3px}
.slot:hover{background:#ffffff14;outline:1px solid #fff4}
.notes{margin:0 24px 30px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.note{background:#201c16;border:1px solid var(--line);border-radius:10px;padding:12px 14px}.note h3{margin:0 0 4px;font-size:14px;color:var(--acc)}.note p{margin:0;color:var(--mute)}

const P={heroi:'Herói',anao:'Anão',elfo:'Elfo',demonio:'Demônio',pirata:'Pirata',ursal:'Ursal'};
let cur=T[0],pic=cur.p,spent=[false,true,false];
const $=s=>document.getElementById(s);
T.forEach(t=>{const b=document.createElement('button');b.className='tab';b.innerHTML=t.n+'<small>'+t.c+'</small>';b.onclick=()=>{cur=t;pic=t.p;$('pic').value=pic;render()};t.btn=b;$('tabs').append(b)});
Object.entries(P).forEach(([k,v])=>$('pic').append(new Option(v,k)));$('pic').value=pic;
T.forEach(t=>{const d=document.createElement('div');d.className='note';d.innerHTML='<h3>'+t.n+'</h3><p>'+t.d+'</p>';$('notes').append(d)});
const pos=(el,b)=>{el.style.left=b[0]+'%';el.style.top=b[1]+'%';el.style.width=b[2]+'%';el.style.height=b[3]+'%';return el};
const mk=(cls,b)=>{const e=document.createElement('div');e.className='abs '+cls;return b?pos(e,b):e};
function render(){
 T.forEach(t=>t.btn.setAttribute('aria-pressed',t===cur));
 const l=L[cur.k],k=cur.k,h=$('hud');h.innerHTML='';h.style.setProperty('--w',$('sz').value+'px');
 $('tag').textContent='Mapa de batalha (fundo de teste) · '+cur.n;
 const f=document.createElement('img');f.className='frame';f.src=k+'/frame.webp';h.append(f);
 const hp=+$('hp').value,mp=+$('mp').value,mode=$('cry').value;
 const pr=mk('por',l.portrait);pr.style.webkitMaskImage=pr.style.maskImage='url('+MASK[k]+')';
 if(hp==0)pr.classList.add('down');if(k=='corsario')pr.classList.add('zoom');
 pr.innerHTML='<img class="pic" src="'+pic+'.webp">'+(mode=='full'?'<img class="cry" src="'+k+'/crystal.webp">':'')+(mode!='none'?'<img class="fac" src="'+k+'/facets.webp"><div class="shine"></div>':'');
 h.append(pr);
 [['hp',hp,'PV',24],['mp',mp,'PM',12]].forEach(([id,v,lb,mx],i)=>{const b=mk('bar',l.bars[i]);const im=document.createElement('img');im.src=k+'/'+id+'.webp';im.style.clipPath='inset(0 '+(100-v)+'% 0 0)';b.append(im);const s=document.createElement('span');s.textContent=lb+' '+Math.round(mx*v/100)+'/'+mx;b.append(s);h.append(b)});
 [['22','DEF'],['9m','DESL'],['+6','INI'],['16','CD']].forEach(([v,lb],i)=>{const b=mk('box',l.boxes[i]);b.innerHTML='<b>'+v+'</b><i>'+lb+'</i>';b.title={DEF:'Defesa',DESL:'Deslocamento',INI:'Iniciativa',CD:'CD de magia'}[lb];h.append(b)});
 const names=['Ação padrão','Ação de movimento','Reação'];
 l.dia.forEach((d,i)=>{const sz=l['act'+(i+1)+'_size'];const cx=d[0]+d[2]/2,cy=d[1]+d[3]/2;const a=document.createElement('img');a.className='abs act'+(spent[i]?' spent':'');a.src=k+'/act'+(i+1)+'.webp';a.title=names[i]+(spent[i]?' (gasta)':' (disponível)');
  a.style.left=(cx-sz[0]/2)+'%';a.style.top=(cy-sz[1]/2)+'%';a.style.width=sz[0]+'%';a.onclick=()=>{spent[i]=!spent[i];render()};h.append(a)});
 l.slots.forEach((s,i)=>{const e=mk('slot',s);e.textContent=(i+1)%10;e.title='Atalho '+((i+1)%10)+' (arraste um item, magia ou poder)';h.append(e)});
}
['pic','cry','hp','mp','sz'].forEach(i=>$(i).addEventListener('input',()=>{if(i=='pic')pic=$('pic').value;render()}));
render();
</script></body></html>
